services:
  - type: web
    name: deportepicks-ai-vip
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MASTER_ADMIN_CODE
        value: DeportePicks
